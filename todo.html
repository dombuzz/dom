<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Todo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0952a'/%3E%3Cpath fill='none' stroke='%2307090f' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' d='M28 52l15 15 30-32'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/glass.css">
<style>
  :root {
    --bg: #07090f; --card: #0d1220; --field: #131b2e; --text: #b8c8e0; --muted: #6b7f9e;
    --line: #1c2a40; --accent: #f0952a; --link: #ffd166; --done: #4a5a74; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: -12px 0 24px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  #new {
    flex: 1; min-width: 0; padding: 14px 16px; font: inherit; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  #new:hover, #new:focus { border-color: var(--accent); }
  #new::placeholder { color: var(--muted); }
  .add {
    padding: 0 18px; font: inherit; font-weight: 600; color: var(--bg);
    background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
  }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  li { display: flex; align-items: flex-start; gap: 10px; padding: 6px 6px 6px 14px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  input[type=checkbox] {
    appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; margin: 0;
    border: 2px solid var(--muted); border-radius: 6px; background: transparent;
    display: grid; place-content: center; cursor: pointer; margin-top: 9px;
  }
  input[type=checkbox]:hover { border-color: var(--accent); }
  input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after {
    content: ""; width: 6px; height: 11px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .txt {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent;
    border: 0; padding: 8px 6px; border-radius: 8px; outline: none;
    resize: none; overflow: hidden; display: block; line-height: 1.5; overflow-wrap: anywhere;
  }
  .txt:focus { background: var(--field); }
  li.done .txt { color: var(--done); text-decoration: line-through; }
  .del {
    flex: none; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; margin-top: 2px;
  }
  .del:hover, .del:focus-visible { color: var(--accent); background: var(--field); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { display: block; padding: 24px 16px; text-align: center; color: var(--muted); }
  .tools { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .clear { font: inherit; color: var(--link); background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .clear:disabled { color: var(--done); cursor: default; }
  .donesec { margin-top: 40px; }
  .donehead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .donehead h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .donehead h2 span { font-variant-numeric: tabular-nums; }
  .donehead .clear { font-size: 14px; }
  #donelist { background: transparent; }
  footer a { color: var(--muted); text-underline-offset: 3px; }
  footer a:hover, footer a:focus-visible { color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  .login { display: grid; gap: 12px; }
  .login .sub { margin: 0 0 4px; }
  .login .add { padding: 14px 18px; }
  .login .add:disabled { opacity: .6; cursor: default; }
  #pw {
    width: 100%; padding: 14px 16px; font: inherit; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  #pw:hover, #pw:focus { border-color: var(--accent); }
  #pw::placeholder { color: var(--muted); }
  .loginmsg { margin: 0; min-height: 1.5em; color: var(--link); font-size: 14px; }
  .logout { font: inherit; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .logout:hover, .logout:focus-visible { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main>
<form class="login" id="login" hidden>
  <h1><span>to</span>do</h1>
  <p class="sub">Bitte anmelden. Das Gerät bleibt eine Woche angemeldet.</p>
  <input id="pw" type="password" placeholder="Passwort" aria-label="Passwort" autocomplete="current-password" required>
  <button class="add" id="loginbtn" type="submit">Anmelden</button>
  <p class="loginmsg" id="loginmsg" role="alert"></p>
</form>
<div id="app" hidden>
  <h1><span>to</span>do</h1>
  <p class="sub" id="count">0 offen, 0 erledigt</p>
  <div class="bar"><i id="progress"></i></div>

  <form id="form">
    <input id="new" type="text" placeholder="Neue Aufgabe …" aria-label="Neue Aufgabe" autocomplete="off">
    <button class="add" type="submit">Hinzufügen</button>
  </form>

  <ul id="list"></ul>

  <div class="tools">
    <span id="note">Gespeichert in diesem Browser</span>
  </div>

  <section class="donesec" id="donesec" hidden>
    <div class="donehead">
      <h2>Erledigt <span id="donecount"></span></h2>
      <button class="clear" id="clear" type="button">Alle löschen</button>
    </div>
    <ul id="donelist"></ul>
  </section>

  <footer><a href="/">← dombuzz</a> · <button class="logout" id="logout" type="button">Abmelden</button></footer>
</div>
</main>

<script>
  // Die Liste liegt beim Cloudflare-Worker «todo» und ist so auf allen Geräten gleich.
  // Zugang per Passwort; das Gerät merkt sich die Anmeldung 7 Tage lang.
  const API = 'https://todo.zappa-pfadi.workers.dev/todos';
  const CACHE = 'dom-todo';           // lokale Kopie, damit die Liste sofort erscheint
  const AUTH = 'dom-todo-auth';       // { token, at }
  const WEEK = 7 * 24 * 60 * 60 * 1000;

  const $ = id => document.getElementById(id);
  const list = $('list'), note = $('note');
  let items = [], token = '', timer = null, pending = false;

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };

  /* ---------- Anmeldung ---------- */
  // SHA-256 (hex) des Passworts. Platzhalter ersetzen, siehe worker/todo.js.
  const PW_HASH = '19f1b1dd21cddebda73d942780b1b94af707f404faa2204ceea6102fbf780db6';
  async function sha256(pw) {
    const bits = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function showLogin(text = '') {
    token = ''; store.del(AUTH);
    $('app').hidden = true; $('login').hidden = false;
    $('loginmsg').textContent = text; $('pw').focus();
  }
  $('login').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('loginmsg'), btn = $('loginbtn');
    msg.textContent = ''; btn.disabled = true; btn.textContent = 'Prüfe …';
    try {
      const ok = (await sha256($('pw').value.trim())) === PW_HASH;
      if (!ok) { msg.textContent = 'Passwort falsch.'; $('pw').select(); return; }
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      token = 'ok'; store.set(AUTH, { token, at: Date.now() });
      $('pw').value = '';
      unlock(await res.json());
    } catch {
      msg.textContent = 'Server nicht erreichbar. Bitte später nochmals versuchen.';
    } finally { btn.disabled = false; btn.textContent = 'Anmelden'; }
  });
  $('logout').addEventListener('click', () => showLogin());

  function unlock(server) {
    $('login').hidden = true; $('app').hidden = false;
    items = store.get(CACHE) || [];
    if (server) apply(server);
    render();
  }

  /* ---------- Synchronisation ---------- */
  function apply(server) {
    // Erster Start: Server leer, aber lokal schon Aufgaben → hochladen
    if (!server.updated && !server.items.length && items.length) { queue(); return; }
    items = server.items; store.set(CACHE, items);
    setNote('Synchronisiert');
  }
  async function pull() {
    if (!token || pending || document.activeElement?.classList.contains('txt')) return;
    try {
      const res = await fetch(API, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
      if (res.status === 401) return showLogin('Bitte neu anmelden.');
      if (!res.ok) throw 0;
      apply(await res.json()); render();
    } catch { setNote('Offline – zeigt den letzten Stand'); }
  }
  function queue() {
    pending = true; setNote('Speichert …');
    clearTimeout(timer); timer = setTimeout(push, 600);
  }
  async function push() {
    try {
      const res = await fetch(API, {
        method: 'PUT', cache: 'no-store',
        headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      if (res.status === 401) { pending = false; return showLogin('Bitte neu anmelden.'); }
      if (!res.ok) throw 0;
      pending = false; setNote('Synchronisiert');
    } catch { setNote('Offline – wird später synchronisiert'); }
  }
  function save() { store.set(CACHE, items); queue(); }
  function setNote(t) { note.textContent = t; }

  // Beim Zurückkehren zur Seite und jede Minute neuesten Stand holen
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pending ? push() : pull(); });
  window.addEventListener('online', () => pending ? push() : pull());
  setInterval(() => { if (!document.hidden) pending ? push() : pull(); }, 60000);

  /* ---------- Liste ---------- */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const remove = it => { items = items.filter(x => x !== it); save(); render(); };

  function row(it) {
    const li = document.createElement('li');
    if (it.done) li.className = 'done';

    // Abhaken verschiebt nach unten, Haken entfernen holt die Aufgabe zurück
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = it.done;
    cb.setAttribute('aria-label', it.done ? 'Wieder offen' : 'Erledigt');
    cb.addEventListener('change', () => { it.done = cb.checked; save(); render(); });

    // Mehrzeiliges Feld, wächst mit dem Text. Enter speichert, Shift+Enter = neue Zeile.
    const tx = document.createElement('textarea');
    tx.className = 'txt'; tx.rows = 1; tx.value = it.text; tx.setAttribute('aria-label', 'Aufgabe bearbeiten');
    tx.addEventListener('input', () => grow(tx));
    tx.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); tx.blur(); } });
    tx.addEventListener('change', () => {
      const v = tx.value.trim();
      if (!v) return remove(it);
      it.text = v; save(); render();
    });

    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', 'Löschen');
    del.addEventListener('click', () => remove(it));

    li.append(cb, tx, del);
    return li;
  }

  function render() {
    const open = items.filter(i => !i.done), done = items.filter(i => i.done);
    $('count').textContent = `${open.length} offen, ${done.length} erledigt`;
    $('progress').style.width = (items.length ? done.length / items.length * 100 : 0) + '%';

    list.replaceChildren();
    if (!open.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = items.length ? 'Alles erledigt.' : 'Keine Aufgaben. Schreib oben die erste hinein.';
      list.append(li);
    }
    open.forEach(it => list.append(row(it)));

    $('donesec').hidden = !done.length;
    $('donecount').textContent = done.length ? `(${done.length})` : '';
    $('donelist').replaceChildren(...done.map(row));

    document.querySelectorAll('.txt').forEach(grow);
  }

  function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
  window.addEventListener('resize', () => document.querySelectorAll('.txt').forEach(grow));

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const inp = $('new');
    const v = inp.value.trim();
    if (!v) return;
    items.unshift({ id: uid(), text: v, done: false });
    inp.value = '';
    save(); render(); inp.focus();
  });

  $('clear').addEventListener('click', () => {
    items = items.filter(i => !i.done); save(); render();
  });

  /* ---------- Start ---------- */
  const auth = store.get(AUTH);
  if (auth && auth.token && Date.now() - auth.at < WEEK) { token = auth.token; unlock(null); pull(); }
  else showLogin();
</script>
</body>
</html>
