<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Todo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0952a'/%3E%3Cpath fill='none' stroke='%2307090f' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' d='M28 52l15 15 30-32'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #07090f; --card: #0d1220; --field: #131b2e; --text: #b8c8e0; --muted: #6b7f9e;
    --line: #1c2a40; --accent: #f0952a; --link: #ffd166; --done: #4a5a74; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: -12px 0 24px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  #new {
    flex: 1; min-width: 0; padding: 14px 16px; font: inherit; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  #new:hover, #new:focus { border-color: var(--accent); }
  #new::placeholder { color: var(--muted); }
  .add {
    padding: 0 18px; font: inherit; font-weight: 600; color: var(--bg);
    background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
  }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  li { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  input[type=checkbox] {
    appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; margin: 0;
    border: 2px solid var(--muted); border-radius: 6px; background: transparent;
    display: grid; place-content: center; cursor: pointer;
  }
  input[type=checkbox]:hover { border-color: var(--accent); }
  input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after {
    content: ""; width: 6px; height: 11px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .txt {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: transparent;
    border: 0; padding: 8px 6px; border-radius: 8px; outline: none;
  }
  .txt:focus { background: var(--field); }
  li.done .txt { color: var(--done); text-decoration: line-through; }
  .del {
    flex: none; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer;
  }
  .del:hover, .del:focus-visible { color: var(--accent); background: var(--field); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { display: block; padding: 24px 16px; text-align: center; color: var(--muted); }
  .tools { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .clear { font: inherit; color: var(--link); background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .clear:disabled { color: var(--done); cursor: default; }
  footer a { color: var(--muted); text-underline-offset: 3px; }
  footer a:hover, footer a:focus-visible { color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main>
  <h1><span>to</span>do</h1>
  <p class="sub" id="count">0 von 0 erledigt</p>
  <div class="bar"><i id="progress"></i></div>

  <form id="form">
    <input id="new" type="text" placeholder="Neue Aufgabe …" aria-label="Neue Aufgabe" autocomplete="off">
    <button class="add" type="submit">Hinzufügen</button>
  </form>

  <ul id="list"></ul>

  <div class="tools">
    <span id="note">Gespeichert in diesem Browser</span>
    <button class="clear" id="clear" type="button">Erledigte entfernen</button>
  </div>

  <footer><a href="/">← dombuzz</a></footer>
</main>

<script>
  // Die Liste wird im Browser gespeichert (localStorage) – pro Gerät und Browser.
  const KEY = 'dom-todo';
  const list = document.getElementById('list');
  const note = document.getElementById('note');
  let items = [];

  try { items = JSON.parse(localStorage.getItem(KEY)) || []; }
  catch { items = []; }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); note.textContent = 'Gespeichert in diesem Browser'; }
    catch { note.textContent = 'Speichern nicht möglich (privates Fenster?)'; }
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const remove = it => { items = items.filter(x => x !== it); save(); render(); };

  function render() {
    const done = items.filter(i => i.done).length;
    document.getElementById('count').textContent = `${done} von ${items.length} erledigt`;
    document.getElementById('progress').style.width = (items.length ? done / items.length * 100 : 0) + '%';
    document.getElementById('clear').disabled = !done;

    list.replaceChildren();
    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Keine Aufgaben. Schreib oben die erste hinein.';
      list.append(li);
      return;
    }
    for (const it of items) {
      const li = document.createElement('li');
      if (it.done) li.className = 'done';

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = it.done; cb.setAttribute('aria-label', 'Erledigt');
      cb.addEventListener('change', () => { it.done = cb.checked; save(); render(); });

      const tx = document.createElement('input');
      tx.type = 'text'; tx.className = 'txt'; tx.value = it.text; tx.setAttribute('aria-label', 'Aufgabe bearbeiten');
      tx.addEventListener('keydown', e => { if (e.key === 'Enter') tx.blur(); });
      tx.addEventListener('change', () => {
        const v = tx.value.trim();
        if (!v) return remove(it);
        it.text = v; save(); render();
      });

      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', 'Löschen');
      del.addEventListener('click', () => remove(it));

      li.append(cb, tx, del);
      list.append(li);
    }
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const inp = document.getElementById('new');
    const v = inp.value.trim();
    if (!v) return;
    items.unshift({ id: uid(), text: v, done: false });
    inp.value = '';
    save(); render(); inp.focus();
  });

  document.getElementById('clear').addEventListener('click', () => {
    items = items.filter(i => !i.done); save(); render();
  });

  render();
</script>
</body>
</html>
