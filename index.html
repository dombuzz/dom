<style>
  :root {
    --bg: #07090f; --card: #0d1220; --field: #131b2e; --text: #b8c8e0; --muted: #6b7f9e;
    --line: #1c2a40; --accent: #f0952a; --link: #ffd166; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .select { position: relative; }
  select {
    width: 100%; appearance: none; -webkit-appearance: none;
    padding: 14px 44px 14px 16px; font: inherit; font-weight: 600; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; outline: none;
  }
  select:hover, select:focus { border-color: var(--accent); }
  select:disabled { cursor: default; color: var(--muted); }
  .select::after {
    content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  option { background: var(--card); color: var(--text); font-weight: 400; }
  .msg { color: var(--muted); margin-top: 16px; }
  .msg a { color: var(--link); }
  footer a { color: var(--muted); text-underline-offset: 3px; }
  footer a:hover, footer a:focus-visible { color: var(--accent); }
  footer .red { color: #ff4d64; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1><span>dom</span>buzz</h1>
  <p class="sub">Tool auswählen, es öffnet sich direkt.</p>
  <div class="select">
    <select id="tools" aria-label="Tool auswählen" disabled>
      <option value="">Lade Tools …</option>
    </select>
  </div>
  <p class="msg" id="msg" hidden></p>
  <footer><a href="https://tools.dombuzz.ch/">→ dombuzz <span class="red">Tools</span></a></footer>
</main>

<script>
  // Einstellungen
  const REPO = 'dombuzz/dom';
  const BRANCH = 'main';
  const HIDE = ['index.html', '404.html']; // erscheinen nicht in der Liste

  // Anzeigenamen im Dropdown (Dateiname -> Name). Nicht aufgeführte Dateien zeigen ihren <title>.
  const NAMES = {
    'suncal.html':  'Sonnenkalender',
    'sunhome.html': 'Sonnenkalender@Home',
    'termica.html': 'Flugwetter',
    'bau.html':     'Baufortschritt Wärmepumpe',
    'eli.html':     'Eli'
  };

  // Gruppen im Dropdown. Die Tools erscheinen in der hier aufgeführten Reihenfolge.
  // Nicht aufgeführte Dateien landen alphabetisch in DEFAULT_GROUP.
  const GROUPS = {
    'Dom': ['suncal.html', 'sunhome.html', 'termica.html', 'bau.html', 'eli.html']
  };
  const DEFAULT_GROUP = 'Dom';
  const GROUP_ORDER = ['Dom'];

  const sel = document.getElementById('tools');
  const msg = document.getElementById('msg');

  // Pfad -> Adresse ohne .html ("votgr.html" -> "votgr")
  const toUrl = p => p.replace(/(^|\/)index\.html?$/i, '$1').replace(/\.html?$/i, '');

  async function titleOf(url, fallback) {
    try {
      const res = await fetch('/' + url);
      if (!res.ok) return fallback;
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      return (doc.title || '').trim() || fallback;
    } catch { return fallback; }
  }

  async function load() {
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const files = (await res.json()).tree
        .filter(f => f.type === 'blob' && /\.html?$/i.test(f.path) && !HIDE.includes(f.path));
      const tools = await Promise.all(files.map(async f => {
        const url = toUrl(f.path);
        const group = Object.keys(GROUPS).find(g => GROUPS[g].includes(f.path)) || DEFAULT_GROUP;
        const pos = GROUPS[group] ? GROUPS[group].indexOf(f.path) : -1;
        return { url, group, pos, title: NAMES[f.path] || await titleOf(url, f.path.split('/').at(-1).replace(/\.html?$/i, '')) };
      }));
      tools.sort((a, b) => a.title.localeCompare(b.title, 'de'));

      sel.innerHTML = '';
      sel.append(new Option(tools.length ? 'Tool wählen …' : 'Keine Tools gefunden', ''));
      const order = [...GROUP_ORDER, ...new Set(tools.map(t => t.group))].filter((g, i, a) => a.indexOf(g) === i);
      for (const g of order) {
        const items = tools.filter(t => t.group === g)
          .sort((a, b) => (a.pos < 0 ? 1e9 : a.pos) - (b.pos < 0 ? 1e9 : b.pos) || a.title.localeCompare(b.title, 'de'));
        if (!items.length) continue;
        for (const t of items) sel.append(new Option(t.title, '/' + t.url));
      }
      sel.disabled = !tools.length;
    } catch (e) {
      sel.innerHTML = '<option value="">Liste nicht verfügbar</option>';
      msg.hidden = false;
      msg.innerHTML = 'Die Liste konnte gerade nicht geladen werden (' + e.message +
        '). Bitte später neu laden oder direkt im <a href="https://github.com/' + REPO + '">Repository</a> nachsehen.';
    }
  }

  sel.addEventListener('change', () => { if (sel.value) location.href = sel.value; });
  // Beim Zurückkehren mit dem Zurück-Button wieder auf "Tool wählen" stellen
  window.addEventListener('pageshow', () => { sel.selectedIndex = 0; });
  load();
</script>
</body>
