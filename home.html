<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Hausübersicht</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0952a'/%3E%3Cpath fill='%2307090f' d='M50 20 20 46h8v30h16V58h12v18h16V46h8z'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="/glass.css">
<script src="/tip.js" defer></script>
<style>
  :root {
    --bg: #07090f; --card: #0d1220; --field: #131b2e; --text: #b8c8e0; --muted: #6b7f9e;
    --line: #1c2a40; --accent: #f0952a; --link: #ffd166; --bad: #ff4d64; --ok: #5fd39a;
    --r0: #3d95f0; --r1: #d27a10; --r2: #a46ae6; --r3: #1ea97c; --r4: #e0607e; --r5: #8a9bb8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 72px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 17px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  .sub b { color: var(--text); font-weight: 600; }
  .sub.bad b { color: var(--bad); }
  .sec { margin-top: 28px; }
  .sh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .sh a { color: var(--muted); font-size: 13px; text-underline-offset: 3px; white-space: nowrap; }
  .sh a:hover, .sh a:focus-visible { color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .tile .k { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; margin-top: 2px; }
  .tile .v small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .tile .s { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .tile.stale .v { opacity: .45; }
  #rooms .tile .k { white-space: normal; }
  .tile .k .dot { width: 9px; height: 9px; }
  .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 10px; margin-top: 10px; }
  .chart { position: relative; height: 260px; }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .m { padding: 11px 16px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .m:first-child { border-top: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(95,211,154,.15); }
  .dot.mid { background: var(--link); box-shadow: 0 0 0 3px rgba(255,209,102,.15); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(255,77,100,.18); }
  .m b { font-weight: 600; color: var(--text); }
  .m .st { margin-left: auto; color: var(--muted); font-size: 14px; text-align: right; }
  .m.bad .st { color: var(--bad); font-weight: 600; }
  .on { color: var(--ok); } .off { color: var(--muted); }
  .warn { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  footer p { margin: 0 0 10px; }
  footer a { color: var(--muted); text-underline-offset: 3px; }
  footer a:hover, footer a:focus-visible { color: var(--accent); }
  @media (max-width: 600px) {
    main { padding-top: 48px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile .v { font-size: 21px; }
    .chart { height: 230px; }
  }
</style>
</head>
<body class="kl">
<main>
  <h1><span>Haus</span>übersicht</h1>
  <p class="sub" id="sum">Daten werden geladen …</p>

  <section class="sec">
    <div class="sh"><h2>Temperaturen</h2><a href="https://klima.dombuzz.ch/">Raumklima →</a></div>
    <div class="tiles" id="rooms"></div>
    <div class="panel" id="p-temp" hidden>
      <div class="chart"><canvas id="ctemp" aria-label="Temperaturverlauf der letzten 24 Stunden"></canvas></div>
    </div>
  </section>

  <section class="sec">
    <div class="sh"><h2>Wärmepumpe</h2><a href="/wp">Details →</a></div>
    <div class="tiles" id="hp"></div>
  </section>

  <section class="sec">
    <div class="sh"><h2>Rauchmelder</h2><a href="/fire">Details →</a></div>
    <div class="list" id="fire"></div>
  </section>

  <footer>
    <p id="src"></p>
    <p><a href="/">→ <span style="color:var(--accent)">dom</span>buzz</a></p>
  </footer>
</main>
<script>
  const KLIMA = 'https://klima.zappa-pfadi.workers.dev';
  const WP = 'https://wp.zappa-pfadi.workers.dev';
  const COLORS = ['--r0', '--r1', '--r2', '--r3', '--r4', '--r5'];
  const BATT = ['leer', 'schwach', 'gut', 'voll'];
  const STALE_T = 30 * 60, STALE_WP = 30 * 60, STALE_FIRE = 13 * 3600;
  const $ = id => document.getElementById(id);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (n, d = 1) => n == null || !isFinite(n) ? '–' : Number(n).toLocaleString('de-CH', { minimumFractionDigits: d, maximumFractionDigits: d });
  function ago(sec) {
    if (sec < 90) return 'gerade eben';
    if (sec < 3600) return `vor ${Math.round(sec / 60)} Min.`;
    if (sec < 86400) return `vor ${Math.round(sec / 3600)} Std.`;
    return `vor ${Math.round(sec / 86400)} Tagen`;
  }
  const get = async (url, opt) => { const r = await fetch(url, { cache: 'no-store', ...opt }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
  const CMP = { OFF: 'aus', ON: 'läuft', HEATING: 'heizt', DHW: 'Warmwasser', COOLING: 'kühlt', DEFROST: 'taut ab', STANDBY: 'Standby' };
  const cmpText = v => v == null ? null : CMP[String(v).toUpperCase()] || String(v);
  const cmpOn = v => v != null && !/^(off|aus|standby|idle|stop)/i.test(String(v));

  let chart = null;
  const issues = [];   // Meldungen für die Zusammenfassung oben

  /* ---------- Temperaturen ---------- */
  async function loadTemps() {
    const [k, w] = await Promise.all([
      get(`${KLIMA}/data?range=24h`).catch(() => null),
      get(`${WP}/klima?range=24h`).catch(() => null),
    ]);
    if (!k && !w) { $('rooms').innerHTML = '<div class="empty">Temperaturen nicht erreichbar.</div>'; issues.push('Temperaturen nicht erreichbar'); return; }
    let latest = (k && k.latest) || [], series = (k && k.series) || {}, now = (k && k.now) || (w && w.now);
    if (w && w.sensor && w.sensor.last) {
      latest = latest.filter(s => s.id !== w.sensor.id).concat(w.sensor);
      series = { ...series, [w.sensor.id]: w.series || [] };
      now = now || w.now;
    }
    const all = latest.filter(s => s.last);
    const isStale = s => s.stale || now - s.last.ts > STALE_T;
    for (const s of all) if (isStale(s)) issues.push(`${s.name} meldet nicht`);

    // Aussen: eigener Aussensensor, sonst der Fühler der Wärmepumpe
    const outs = all.filter(s => s.outdoor);
    const out = outs.find(s => s.source !== 'wp') || outs[0] || null;
    // Im Haus: Mittelwert aller Innensensoren (nur solche, die aktuell melden)
    const ins = all.filter(s => !s.outdoor);
    const live = ins.filter(s => !isStale(s));
    const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    const inT = mean(live.map(s => s.last.temp)), inH = mean(live.filter(s => s.last.hum != null).map(s => s.last.hum));
    const inTs = Math.max(0, ...live.map(s => s.last.ts));

    const t = (name, c, v, sub, stale, tip) => `<div class="tile${stale ? ' stale' : ''}" style="--rc:var(${c})"${tip ? ` data-tip="${esc(tip)}" tabindex="0"` : ''}><div class="k"><span class="sw" style="background:var(${c})"></span>${name}</div>
      <div class="v">${fmt(v)}${v != null ? '<small>°C</small>' : ''}</div><div class="s">${esc(sub)}</div></div>`;
    const tiles = [];
    if (out) tiles.push(t('Aussen', '--r0', out.last.temp, ago(Math.max(0, now - out.last.ts)), isStale(out), 'Aussentemperatur, vorerst gemessen am Fühler der Wärmepumpe. Sobald ein eigener Aussensensor läuft, gilt dessen Wert.'));
    if (ins.length) {
      const sub = [inH != null ? `${fmt(inH, 0)} % rF` : null, live.length ? ago(Math.max(0, now - inTs)) : 'meldet nicht'].filter(Boolean).join(' · ');
      tiles.push(t('Im Haus', '--r1', inT, sub, !live.length, 'Mittelwert der Temperatur aller Innensensoren, die gerade melden. Sensoren ohne aktuelle Meldung werden nicht mitgerechnet.'));
    }
    if (!ins.length) {   // Kachel bleibt sichtbar, auch wenn die Innensensoren nicht erreichbar sind
      issues.push(k ? 'Keine Innensensoren gefunden' : 'Innensensoren nicht erreichbar');
      tiles.push(t('Im Haus', '--r1', null, k ? 'noch kein Sensor' : 'nicht erreichbar', true, 'Mittelwert der Temperatur aller Innensensoren. Zurzeit sind keine Werte verfügbar.'));
    }
    $('rooms').innerHTML = tiles.join('') || '<div class="empty">Noch keine Messwerte.</div>';

    // Verlauf: Aussen und Mittelwert der Innensensoren (5-Minuten-Raster)
    const BIN = 300;
    const inSeries = (() => {
      const m = new Map();
      for (const s of ins) for (const r of (series[s.id] || [])) {
        if (r[1] == null) continue;
        const key = Math.round(r[0] / BIN) * BIN, e = m.get(key) || [0, 0];
        e[0] += r[1]; e[1]++; m.set(key, e);
      }
      return [...m.entries()].sort((x, y) => x[0] - y[0]).map(([ts, e]) => [ts, e[0] / e[1]]);
    })();
    const sets = [];
    if (out) sets.push({ label: 'Aussen', rows: (series[out.id] || []).filter(r => r[1] != null).map(r => [r[0], r[1]]), c: '--r0', dash: [5, 4] });
    if (inSeries.length) sets.push({ label: 'Im Haus', rows: inSeries, c: '--r1', dash: [] });
    const xmax = now * 1000, xmin = xmax - 864e5;
    const datasets = sets.map(d => ({
      label: d.label, data: d.rows.map(r => ({ x: r[0] * 1000, y: r[1] })),
      borderColor: css(d.c), backgroundColor: css(d.c), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.25, spanGaps: 20 * 60e3, borderDash: d.dash,
    })).filter(d => d.data.length > 1);
    $('p-temp').hidden = !datasets.length;
    if (chart) { chart.destroy(); chart = null; }
    if (!datasets.length) return;
    chart = new Chart($('ctemp'), { type: 'line', data: { datasets }, options: {
      responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      scales: {
        x: { type: 'linear', min: xmin, max: xmax, grid: { color: css('--line') },
             ticks: { color: css('--muted'), maxRotation: 0, autoSkipPadding: 18, callback: v => new Date(v).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) } },
        y: { grid: { color: css('--line') }, ticks: { color: css('--muted'), callback: v => v + ' °' } },
      },
      plugins: {
        legend: { position: 'top', align: 'start', labels: { color: css('--text'), boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 3, font: { size: 13 } } },
        tooltip: { backgroundColor: '#131b2e', borderColor: css('--line'), borderWidth: 1, titleColor: css('--text'), bodyColor: css('--text'), padding: 10, boxPadding: 4, usePointStyle: true,
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
          callbacks: { title: it => new Date(it[0].parsed.x).toLocaleString('de-CH', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
                       label: c => `${c.dataset.label}: ${fmt(c.parsed.y)} °C` } },
      },
    } });
  }

  /* ---------- Wärmepumpe ---------- */
  const TIP = {
    cmp: 'Der Verdichter (Kompressor) ist das Herz der Wärmepumpe. Grüner Punkt: Er läuft gerade. Die Modulation gibt an, mit wie viel Leistung in Prozent.',
    sup: 'Temperatur des Heizwassers, das die Wärmepumpe in die Heizung schickt (darunter der Rücklauf). Je tiefer, desto effizienter.',
    dhw: 'Temperatur im Warmwasserspeicher.',
    elT: 'Stromverbrauch der Wärmepumpe seit Mitternacht (darunter der Gesamtverbrauch seit Inbetriebnahme).',
    heatT: 'Erzeugte Wärme für Heizung und Warmwasser seit Mitternacht (darunter die Gesamtmenge seit Inbetriebnahme).',
  };
  const copTip = c => 'Erzeugte Wärme geteilt durch eingesetzten Strom, über die ganze Laufzeit.' + (c != null ? ` ${fmt(c)} heisst: Aus 1 kWh Strom werden ${fmt(c)} kWh Wärme.` : '') + ' Je höher, desto effizienter.';
  const tile = (k, v, unit, s, tip, rc) => `<div class="tile" style="--rc:var(${rc || '--accent'})"${tip ? ` data-tip="${esc(tip)}" tabindex="0"` : ''}><div class="k">${k}</div><div class="v">${v}${unit && v !== '–' ? `<small>${unit}</small>` : ''}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  async function loadHp() {
    let d;
    try { d = await get(`${WP}/data?range=24h`); } catch (e) { $('hp').innerHTML = '<div class="empty">Wärmepumpe nicht erreichbar.</div>'; issues.push('Wärmepumpe nicht erreichbar'); return; }
    const L = d.latest;
    if (!L) { $('hp').innerHTML = '<div class="empty">Noch keine Messwerte.</div>'; return; }
    const age = d.now - L.ts;
    if (age > STALE_WP) issues.push(`Wärmepumpe: Daten veraltet (${ago(age)})`);
    const c = cmpText(L.cmp);
    const today = d.daily && d.daily.length ? d.daily[d.daily.length - 1] : null;
    const isToday = today && new Date(today[0] * 1000).toDateString() === new Date().toDateString();
    const cop = L.el > 0 && L.heat != null ? L.heat / L.el : null;
    $('hp').innerHTML =
      tile(`<span class="dot${cmpOn(L.cmp) ? ' ok' : ''}"></span>Kompressor`, c ? `<span class="${cmpOn(L.cmp) ? 'on' : 'off'}">${esc(c)}</span>` : '–', '', L.modu != null && cmpOn(L.cmp) ? `Modulation ${fmt(L.modu, 0)} %` : (L.pres != null ? `Druck ${fmt(L.pres)} bar` : ''), TIP.cmp, cmpOn(L.cmp) ? '--ok' : '--r5') +
      tile('Vorlauf', fmt(L.sup), '°C', `Rücklauf ${fmt(L.ret)} °C`, TIP.sup, '--r1') +
      tile('Warmwasser', fmt(L.dhw), '°C', '', TIP.dhw, '--r3') +
      tile('Strom heute', isToday && today[1] != null ? fmt(today[1]) : '–', 'kWh', `gesamt ${fmt(L.el, 0)} kWh`, TIP.elT, '--r0') +
      tile('Wärme heute', isToday && today[2] != null ? fmt(today[2]) : '–', 'kWh', `gesamt ${fmt(L.heat, 0)} kWh`, TIP.heatT, '--r1') +
      tile('Arbeitszahl', fmt(cop), '', 'Wärme ÷ Strom, gesamt', copTip(cop), '--r2');
  }

  /* ---------- Rauchmelder ---------- */
  function problems(m) {
    const p = [];
    if (m.alarm) p.push('Alarm gemeldet');
    if (m.online === false) p.push('offline');
    if (m.lebensende) p.push('Lebensende erreicht');
    if (m.batterie != null && m.batterie <= 1) p.push('Batterie ' + BATT[m.batterie]);
    return p;
  }
  async function loadFire() {
    let d;
    try { d = await get('fire.json?t=' + Date.now()); } catch (e) { $('fire').innerHTML = '<div class="m"><span class="dot"></span>Status nicht verfügbar</div>'; issues.push('Rauchmelder-Status nicht verfügbar'); return; }
    const list = d.melder || [];
    const stale = (Date.now() - Date.parse(d.checked)) / 1000 > STALE_FIRE;
    if (stale) issues.push('Rauchmelder-Status veraltet');
    $('fire').innerHTML = list.map(m => {
      const p = problems(m);
      if (p.length) issues.push(`Rauchmelder ${m.name}: ${p.join(', ')}`);
      const lv = p.length ? 'bad' : m.batterie == null ? '' : m.batterie >= 3 ? 'ok' : 'mid';
      const txt = p.length ? p.join(', ') : m.batterie != null ? 'bereit · Batterie ' + (BATT[m.batterie] || m.batterie) : 'bereit';
      return `<div class="m${p.length ? ' bad' : ''}" style="--rc:var(${p.length ? '--bad' : lv === 'ok' ? '--ok' : lv === 'mid' ? '--link' : '--muted'})"><span class="dot ${lv}"></span><b>${esc(m.name)}</b><span class="st">${esc(txt)}</span></div>`;
    }).join('') || '<div class="m">Keine Melder gefunden.</div>';
  }

  async function load() {
    issues.length = 0;
    await Promise.all([loadTemps(), loadHp(), loadFire()]);
    const bad = issues.length > 0;
    $('sum').className = 'sub' + (bad ? ' bad' : '');
    $('sum').innerHTML = bad ? `<b>${esc(issues[0])}</b>${issues.length > 1 ? ` · ${issues.length - 1} ${issues.length === 2 ? 'weiterer Hinweis' : 'weitere Hinweise'}` : ''}` : '<b>Alles in Ordnung</b>, alle Werte aktuell.';
    $('src').textContent = 'Stand ' + new Date().toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
  }
  load();
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, 5 * 60e3);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
</script>
</body>
</html>
