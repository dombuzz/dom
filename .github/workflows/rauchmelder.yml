name: Rauchmelder-Status

# Alle 30 Minuten den Status der X-Sense-Melder holen.
# Commit nur, wenn sich etwas geändert hat oder der letzte Stand älter als 12 h ist.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rauchmelder
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bibliothek installieren
        run: pip install 'python-xsense[async]==0.0.16'

      - name: Status abfragen
        env:
          XSENSE_USER: ${{ secrets.XSENSE_USER }}
          XSENSE_PASS: ${{ secrets.XSENSE_PASS }}
        run: |
          if [ -z "$XSENSE_USER" ] || [ -z "$XSENSE_PASS" ]; then
            echo '::notice::Secrets XSENSE_USER/XSENSE_PASS fehlen noch, übersprungen'; exit 0
          fi
          python scripts/xsense_status.py fire.new.json

      - name: Bei Änderung speichern
        run: |
          [ -f fire.new.json ] || exit 0
          strip() { jq -S 'del(.checked)' "$1" 2>/dev/null; }
          changed=1
          if [ -f fire.json ] && [ "$(strip fire.json)" = "$(strip fire.new.json)" ]; then
            last=$(jq -r '.checked' fire.json | xargs -I{} date -d {} +%s)
            if [ $(( $(date +%s) - last )) -lt 43200 ]; then changed=0; fi
          fi
          if [ "$changed" = 1 ]; then
            mv fire.new.json fire.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add fire.json
            git commit -m 'Rauchmelder-Status aktualisiert'
            git push
          else
            echo 'Keine Änderung'
          fi
